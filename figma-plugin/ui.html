<style>
  body { font: 13px/1.4 sans-serif; padding: 16px; background: var(--figma-color-bg); color: var(--figma-color-text); }
  button { width: 100%; padding: 10px; font-size: 13px; cursor: pointer; }
  #status { margin-top: 12px; color: var(--figma-color-text-secondary); overflow-wrap: anywhere; }
</style>

<button id="run">Выгрузить переменные</button>
<div id="status"></div>

<script>
  const status = document.getElementById('status');

  document.getElementById('run').onclick = () => {
    status.style.color = 'var(--figma-color-text-secondary)';
    status.textContent = 'Собираю…';
    parent.postMessage({ pluginMessage: { type: 'export' } }, '*');
  };

  onmessage = (event) => {
    const msg = event.data && event.data.pluginMessage;
    if (!msg) return;

    if (msg.type === 'error') {
      status.style.color = 'var(--figma-color-text-danger)';
      status.textContent = 'Ошибка: ' + msg.message;
      return;
    }
    if (msg.type !== 'result') return;

    const blob = new Blob([msg.json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'figma-export.json';
    document.body.appendChild(link);
    link.click();
    link.remove();
    // Отзывать objectURL синхронно с click() нельзя — в части браузеров это
    // обрывает уже начавшуюся загрузку. Даём загрузке стартовать, отзываем позже.
    setTimeout(() => URL.revokeObjectURL(url), 10000);

    const stats = msg.stats || {};
    const danglingVars = stats.danglingAliasIds ? stats.danglingAliasIds.length : 0;
    const danglingTextStyles = stats.danglingTextStyleAliasIds ? stats.danglingTextStyleAliasIds.length : 0;
    const orphanVariables = stats.orphanVariables ?? 0;

    let text = `Готово: переменных ${stats.variables ?? '?'}, ссылок ${stats.aliases ?? '?'}, ` +
      `стилей ${stats.textStyles ?? '?'}, висячих ссылок ${danglingVars}.`;
    if (danglingTextStyles > 0) {
      text += ` Висячих ссылок в стилях: ${danglingTextStyles}.`;
    }
    if (orphanVariables > 0) {
      text += ` Пропущенных переменных: ${orphanVariables}.`;
    }
    status.textContent = text;

    const hasIssues = danglingVars > 0 || danglingTextStyles > 0 || orphanVariables > 0;
    status.style.color = hasIssues ? 'var(--figma-color-text-danger)' : 'var(--figma-color-text-success)';
  };
</script>
